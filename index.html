    <div class="phone-wrapper">
        <div class="physical-btn power-btn" id="physicalPowerBtn"></div>
        <div class="physical-btn vol-btn vol-up-btn" id="physicalVolUpBtn"></div>
        <div class="physical-btn vol-btn vol-down-btn" id="physicalVolDownBtn"></div>

        <div class="mobile-freame-size">
            <div class="screen-brightness-overlay" id="brightnessOverlay"></div>
            <div class="screen-sleep-overlay" id="sleepOverlay">
                <div class="lock-screen-content">
                    <div class="lock-time"><span class="hour"></span>:<span class="minute"></span></div>
                    <div class="lock-date"><span class="day"></span>, <span class="month"></span> <span class="date"></span></div>
                    <div class="lock-tip"><i class="fal fa-chevron-double-up animate-swipe"></i> Click / Press Power to unlock</div>
                </div>
            </div>

            <!-- Control Center Dropdown -->
            <div class="control-center" id="controlCenter">
                <div class="cc-handle"></div>
                <div class="cc-header">
                    <div class="cc-time"><span class="hour"></span>:<span class="minute"></span></div>
                    <div class="cc-battery-percentage"><i class="fad fa-battery-bolt"></i> <span id="ccBatteryPercent">100%</span></div>
                </div>
                <div class="cc-tiles">
                    <div class="cc-tile active" id="ccWifi">
                        <div class="cc-tile-icon"><i class="fad fa-wifi"></i></div>
                        <div class="cc-tile-label">Wi-Fi</div>
                    </div>
                    <div class="cc-tile active" id="ccBluetooth">
                        <div class="cc-tile-icon"><i class="fad fa-bluetooth"></i></div>
                        <div class="cc-tile-label">Bluetooth</div>
                    </div>
                    <div class="cc-tile" id="ccDarkMode">
                        <div class="cc-tile-icon"><i class="fad fa-moon"></i></div>
                        <div class="cc-tile-label">Dark Theme</div>
                    </div>
                    <div class="cc-tile" id="ccFlashlight">
                        <div class="cc-tile-icon"><i class="fad fa-flashlight"></i></div>
                        <div class="cc-tile-label">Flashlight</div>
                    </div>
                </div>
                <div class="cc-sliders">
                    <div class="cc-slider-row">
                        <i class="fad fa-sun"></i>
                        <input type="range" id="ccBrightness" min="20" max="100" value="100">
                    </div>
                    <div class="cc-slider-row">
                        <i class="fad fa-volume-up" id="ccVolumeIcon"></i>
                        <input type="range" id="ccVolume" min="0" max="100" value="70">
                    </div>
                </div>
            </div>

            <!-- Volume HUD overlay -->
            <div class="volume-hud" id="volumeHud">
                <div class="volume-hud-bar">
                    <div class="volume-hud-level" id="volumeHudLevel" style="height: 70%;"></div>
                </div>
                <i class="fad fa-volume-up" id="volumeHudIcon"></i>
            </div>

            <!-- Flashlight beam representation -->
            <div class="flashlight-beam" id="flashlightBeam"></div>

            <div class="loader">
                <div class="loader-image" id="loadImg">
                    <div>
                        <img src="img/oppo_logo.jpg" alt="logo">
                    </div>
                    <div>
                        <img src="img/powerd_by.png" alt="android_logo">
                    </div>
                </div>
            </div>
            <div class="body-flex">
                <div class="notification-bar">
                    <div class="notification_flex">
                        <div class="left-notification">
                            <div class="f_cam">
                                <span class="camera-lens"></span>
                            </div>
                            <div class="notification-time">
                                <span class="hour"></span>:<span class="minute"></span>
                            </div> 
                        </div>
                        <div class="notification-second-panel">
                            <i class="fad fa-wifi" id="statusWifi"></i>
                            <i class="fad fa-bluetooth" id="statusBluetooth" style="margin-right: 2px;"></i>
                            <i class="fad fa-signal-alt"></i>
                            <span id="statusBarPercent" style="font-size: 8px; margin-right: 2px; position: relative; bottom: 3px;">100%</span>
                            <i class="far fa-battery-full" id="statusBatteryIcon"></i>
                        </div>
                    </div>
                </div>

            <div class="middle_body">
                <div class="hider-div">
                    <div class="mobile-scroll-body">
                        <div class="owl-carousel  owl-theme">
                            <div class="item">
                                <div class="slider-body first-slider-body">
                                    <div class="google-search-bar">
                                        <div class="google-round-search">
                                            <div class="g-logo">
                                                <img src="img/Google__G__Logo.png" alt="google logo">
                                            </div>
                                            <div class="google-v-l">
                                                <img src="img/G_voice.png" alt="">
                                                <img src="img/G_leans.png" alt="">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="body-time-info">

                                            <div>
                                                <Span class="hour">51</Span>
                                            </div>
                                            <div>
                                                <span class="minute"></span>
                                            </div>
                                        </div>
                                        
                                        <div class="body-date">
                                            <span class="day"></span>, <span class="month"></span> <span class="date"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="item">
                                <div class="slider-body second-slider-body">
                                    <div class="items-inner">

                                    <div class="items-inner">

                                    <div class="items-inner">

                                        <div></div>
                                    </div>
                                </div>
                            </div>

                            <div class="item">
                                <div class="slider-body second-slider-body">
                                    <div class="items-inner">
                                        <div></div>
                                        <div></div>
                                        <div></div>
                                        <div></div>

                                    </div>

                                        <div></div>
                                        <div></div>
                                    </div>
                                    <div class="items-inner">
                                        <div></div>
                                        <div></div>
                                        <div></div>
                                        <div></div>
                                        <div></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="footer-item">
                            <div class="items-inner">
                                <div>
                                    <div class="items_img" id="call">
                                        <img src="img/items_img/call.jpg" alt="">
                                    </div>
                                </div>
                                <div>
                                    <div class="items_img" id="contact">
                                        <img src="img/items_img/contact.png" alt="">

                                </div>
                                <div>
                                    <div class="items_img" id="message">
                                        <img src="img/items_img/message.png" alt="">

                                </div>
                                <div>
                                    <div class="items_img" id="setting">
                                        <img src="img/items_img/setting.jpg" alt="">

                                <div>
                                    <div class="items_img" id="calc">
                                        <img src="img/items_img/Calculator.png" alt="">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="content-loader-div">
                        <div class="content-relative">
                            <div class="app-open-body">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="navigation-button">
                    <div><i class="fal fa-bars"></i></div>
                    <div class="back"><i class="fal fa-square"></i></div>
                    <div class="back"><i class="fal fa-caret-left"></i></i></div>
                </div>
            </div>
        </div>  
    </div>
</div>
