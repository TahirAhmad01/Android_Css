<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialer</title>
    <link rel="stylesheet" href="../fsm/css/all.css">
    <link rel="stylesheet" href="../css/font.css">
    <link rel="stylesheet" href="../css/call.css">
</head>
<body>
    <div class="dialer-body">
        <div class="suggestions-container" id="suggestionsContainer">
            <!-- Dynamic contact suggestions will show here -->
        </div>

        <div class="number-show">
            <div class="fill"></div>
            <div class="number">
                <div id="num_text">
                    <span></span>
                </div>
                <div class="cut_number"><i class="far fa-backspace"></i></div>
            </div>
        </div>

        <div class="dial-number">
            <div>
                <div class="c_num">1</div>
                <div class="c_num">2</div>
                <div class="c_num">3</div>
            </div>
            <div>
                <div class="c_num">4</div>
                <div class="c_num">5</div>
                <div class="c_num">6</div>
            </div>
            <div>
                <div class="c_num">7</div>
                <div class="c_num">8</div>
                <div class="c_num">9</div>
            </div>
            <div>
                <div class="c_num">*</div>
                <div class="c_num">0</div>
                <div class="c_num">#</div>
            </div>
            <div>
                <span></span>
                <div class="call-ico" id="callButton"><i class="fa fa-phone-alt"></i></div>
                <span></span>
            </div>
        </div>
    </div>

    <!-- Full Screen Call Overlay -->
    <div class="call-overlay" id="callOverlay">
        <div class="call-header">
            <div class="call-security-badge"><i class="fas fa-lock"></i> End-to-end encrypted</div>
        </div>
        <div class="call-recipient">
            <div class="call-avatar" id="callAvatar">?</div>
            <h2 id="callRecipientName">Unknown</h2>
            <p id="callRecipientNumber">01700000000</p>
            <p class="call-status" id="callStatusText">Dialing...</p>
            <div class="call-timer" id="callTimer">00:00</div>
        </div>
        
        <div class="call-action-grid">
            <button class="call-action-btn" id="btnMute">
                <i class="fad fa-microphone-slash"></i>
                <span>Mute</span>
            </button>
            <button class="call-action-btn" id="btnSpeaker">
                <i class="fad fa-volume-up"></i>
                <span>Speaker</span>
            </button>
            <button class="call-action-btn" id="btnHold">
                <i class="fad fa-pause"></i>
                <span>Hold</span>
            </button>
        </div>

        <div class="hangup-container">
            <button class="hangup-btn" id="hangupBtn">
                <i class="fa fa-phone-alt"></i>
            </button>
        </div>
    </div>

    <script src="../js/jquery.min.js"></script>
    <script src="../js/call.js"></script>
</body>
</html>
