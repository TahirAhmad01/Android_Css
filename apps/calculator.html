<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="../css/calc.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="fill"></div>
      <div class="input" id="input"></div>
      <div class="buttons-grid">
        <div class="btn btn-helper" id="clear">C</div>
        <div class="btn btn-helper" id="backspace"><i class="fas fa-backspace"></i></div>
        <div class="btn btn-helper">%</div>
        <div class="btn btn-op">÷</div>

        <div class="btn btn-num">7</div>
        <div class="btn btn-num">8</div>
        <div class="btn btn-num">9</div>
        <div class="btn btn-op">×</div>

        <div class="btn btn-num">4</div>
        <div class="btn btn-num">5</div>
        <div class="btn btn-num">6</div>
        <div class="btn btn-op">-</div>

        <div class="btn btn-num">1</div>
        <div class="btn btn-num">2</div>
        <div class="btn btn-num">3</div>
        <div class="btn btn-op">+</div>

        <div class="btn btn-num btn-zero">0</div>
        <div class="btn btn-num">.</div>
        <div class="btn btn-op" id="result">=</div>
      </div>
    </div>
    
    <link rel="stylesheet" href="../fsm/css/all.css" />
    <script src="../js/jquery.min.js"></script>
    <script src="../js/calc.js"></script>
  </body>
</html>
